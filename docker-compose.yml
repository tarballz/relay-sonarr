services:
  sonarr-unified:
    build: .
    container_name: sonarr-unified
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      - SONARR_1080P_API_KEY=${SONARR_1080P_API_KEY}
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      - CF_ACCESS_ENABLED=${CF_ACCESS_ENABLED:-false}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      # Writable volume for Relay's own durable state (SQLite). Keep separate from
      # the read-only config mount.
      - ./data:/data
    # Single-host hobby workload: cap so a runaway loop can't starve the box.
    # Tune up if your library is large.
    mem_limit: 512m
    cpus: 1.0
    # Mirror the image HEALTHCHECK at the compose layer so `docker compose ps`
    # and dependent services see health state too.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 40s
      retries: 3
