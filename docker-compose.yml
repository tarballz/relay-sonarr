services:
  sonarr-unified:
    build: .
    container_name: sonarr-unified
    restart: unless-stopped
    # Compose sends SIGTERM then waits this long before SIGKILL. Uvicorn's own
    # --timeout-graceful-shutdown (5s) bounds an open SSE client, but lifespan
    # shutdown also waits for an in-progress reconciler tick to finish, so give
    # it real headroom rather than Docker's 10s default.
    stop_grace_period: 30s
    ports:
      - "8088:8000"
    # Everything in .env reaches the container, so optional knobs
    # (RECONCILER_ENABLED, *_CLEANUP_ENABLED, LOG_LEVEL, ...) can be set there
    # without editing this file. The entries below only supply defaults.
    env_file: .env
    environment:
      - SONARR_1080P_API_KEY=${SONARR_1080P_API_KEY}
      - SONARR_4K_API_KEY=${SONARR_4K_API_KEY}
      - CF_ACCESS_ENABLED=${CF_ACCESS_ENABLED:-false}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      # Writable volume for Relay's own durable state (SQLite). Keep separate from
      # the read-only config mount.
      - ./data:/data
    # Single-host hobby workload: cap so a runaway loop can't starve the box.
    # Tune up if your library is large.
    mem_limit: 512m
    cpus: 1.0
    # Bound container logs (the default json-file driver never rotates).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Mirror the image HEALTHCHECK at the compose layer so `docker compose ps`
    # and dependent services see health state too.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 40s
      retries: 3
